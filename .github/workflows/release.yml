name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Marketplace

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          dune-cache: true

      - name: Install Melange
        run: opam install -y dune.3.21.0 melange.6.0.1-52

      - name: Install npm dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Build extension
        run: npm run build:prod

      - name: Check formatting, lint, types, and tests
        run: npm run check

      - name: Run Extension Host smoke test
        run: xvfb-run -a npm run test:integration:run

      - name: Package extension
        run: npm run package

      - name: Debug package contents
        run: |
          echo "Files to be packaged:"
          npm run --silent package:list | wc -l
          npm run --silent package:list | head -100

      - name: Publish to VS Code Marketplace
        run: npm run publish:vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npm run publish:open-vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.vsix --verify-tag --generate-notes
          fi
