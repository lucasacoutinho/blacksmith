name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Marketplace
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Check release version
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match the package.json version');
          }
          NODE

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          opam-repositories: |
            default: https://opam.ocaml.org
          dune-cache: true

      - name: Install OCaml tools
        run: opam install -y dune.3.24.2 melange.7.0.1-52 ocamlformat.0.29.0

      - name: Install npm dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Build extension
        run: npm run build:prod

      - name: Check formatting, lint, types, and tests
        run: npm run check

      - name: Run Extension Host smoke test
        run: xvfb-run -a npm run test:integration:run

      - name: Package extension
        run: npm run package

      - name: Debug package contents
        run: |
          echo "Files to be packaged:"
          npm run --silent package:list | wc -l
          npm run --silent package:list | head -100

      - name: Publish to VS Code Marketplace
        id: vscode
        run: npm run publish:vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        continue-on-error: true

      - name: Publish to Open VSX
        id: open_vsx
        run: npm run publish:open-vsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        continue-on-error: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.vsix --clobber
          else
            gh release create "$RELEASE_TAG" ./*.vsix --verify-tag --generate-notes
          fi

      - name: Check marketplace publishing
        if: ${{ steps.vscode.outcome == 'failure' || steps.open_vsx.outcome == 'failure' }}
        run: |
          echo "A marketplace publish failed. Retry this release after the service recovers."
          exit 1
