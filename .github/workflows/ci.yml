name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
          dune-cache: true

      - name: Install Melange
        run: opam install -y dune.3.21.0 melange.6.0.1-52

      - name: Install npm dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Build extension
        run: npm run build

      - name: Check formatting, lint, types, and tests
        run: npm run check

      - name: Run Extension Host smoke test
        run: xvfb-run -a npm run test:integration:run

      - name: Package extension
        run: npm run package
